name: Update Manifests

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for latest)'
        required: false
        type: string
      tag_pattern:
        description: 'Tag pattern (e.g., v* for v1.0.0, v2.0.0)'
        required: false
        type: string
  release:
    types: [published]

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Ensure latest version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run manifest updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          TAG_PATTERN: ${{ github.event.inputs.tag_pattern }}
        run: |
          args=(--owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          elif [ -n "$TAG_PATTERN" ]; then
            args+=(--tag-pattern "$TAG_PATTERN")
          fi
          python3 update_manifests.py "${args[@]}"

      - name: Commit signed manifest changes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || 'latest' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require('fs');
            const changed = await exec.getExecOutput('git', ['diff', '--name-only', '--',
              'docs/dicts-manifest.json', 'docs/layouts-manifest.json']);
            const paths = changed.stdout.trim().split('\n').filter(Boolean);
            if (!paths.length) {
              core.info('No manifest changes to commit');
              return;
            }
            const head = await exec.getExecOutput('git', ['rev-parse', 'HEAD']);
            const result = await github.graphql(`mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid signature { isValid } } }
            }`, { input: {
              branch: { repositoryNameWithOwner: process.env.GITHUB_REPOSITORY,
                branchName: process.env.DEFAULT_BRANCH },
              expectedHeadOid: head.stdout.trim(),
              message: { headline: `chore: update manifests from release ${process.env.RELEASE_TAG}` },
              fileChanges: { additions: paths.map(path => ({ path,
                contents: fs.readFileSync(path).toString('base64') })) }
            }});
            if (!result.createCommitOnBranch.commit.signature?.isValid) {
              core.setFailed('GitHub did not verify the manifest commit signature');
              return;
            }
            await github.rest.repos.requestPagesBuild(context.repo);
