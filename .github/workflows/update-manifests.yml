name: Update Manifests

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for latest)'
        required: false
        type: string
      tag_pattern:
        description: 'Tag pattern (e.g., v* for v1.0.0, v2.0.0)'
        required: false
        type: string
  release:
    types: [published]

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Ensure latest version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run manifest updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          TAG_PATTERN: ${{ github.event.inputs.tag_pattern }}
        run: |
          args=(--owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          elif [ -n "$TAG_PATTERN" ]; then
            args+=(--tag-pattern "$TAG_PATTERN")
          fi
          python3 update_manifests.py "${args[@]}"

      - name: Commit and push changes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || 'latest' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/dicts-manifest.json docs/layouts-manifest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update manifests from release $RELEASE_TAG"
            git push origin "$DEFAULT_BRANCH"
          fi
